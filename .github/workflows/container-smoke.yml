name: Lambda container smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test smoke-test assertions and signing
        run: python3 -m unittest discover -s .github/scripts -p 'test_rie_smoke.py' -v

      - name: Build both Lambda targets
        run: |
          docker build --provenance=false --platform linux/amd64 --target aws -t lambda-ci:aws .
          docker build --provenance=false --platform linux/amd64 --target local -t lambda-ci:local .

      - name: Invoke both containers through RIE without external networking
        run: |
          python3 .github/scripts/rie_smoke.py --target aws --image lambda-ci:aws
          python3 .github/scripts/rie_smoke.py --target local --image lambda-ci:local

      - name: Remove any remaining test containers
        if: always()
        timeout-minutes: 1
        run: |
          containers="$(docker ps -aq --filter label=lambda-bot-ci=true)"
          if [[ -n "$containers" ]]; then
            # Container IDs are generated by Docker, not repository input.
            docker rm --force $containers
          fi
